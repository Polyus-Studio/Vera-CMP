name: Publish

# Manual, on-demand publishing to GitHub Packages.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run npm publish with --dry-run (no actual publish)'
        type: boolean
        default: false

jobs:
  publish:
    name: Build & publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@polyus-studio'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - name: Publish
        run: npm publish ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
